[dock]
active_monitor_only = true
enabled = true
icon_size = 40
item_spacing = 8
magnification_scale = 1.2500000037252903
pinned = [ "zen-beta", "com.mitchellh.ghostty", "vesktop", "spotify" ]
show_dots = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.0
    cy = 686.71881103515625
    output = "Virtual-1"
    placement_height = 900.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
background_opacity = 0.79999998211860657
hide_delay_ms = 1000

[shell]
font_family = "Hack Nerd Font"
polkit_agent = true

    [shell.panel]
    control_center_position = "top_right"

    [shell.screenshot]
    confirm_region = true

[theme]
builtin = "Kanagawa"
community_palette = "Kanagawa Dragon"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop" ]
    community_ids = [ "spicetify", "discord" ]

[wallpaper]
directory = "/home/joao/Pictures/wallpapers"
fill_mode = "fit"

    [wallpaper.default]
    path = "/home/joao/Pictures/wallpapers/tree.jpg"

    [wallpaper.last]
    path = "/home/joao/Pictures/wallpapers/tree.jpg"

    [wallpaper.monitors.Virtual-1]
    path = "/home/joao/Pictures/wallpapers/tree.jpg"

[weather]
enabled = false

[widget.battery]
enabled = false

[widget.control-center]
enabled = false
