[nightlight]
autoSchedule = true
enabled = true
force = false
temperature_day = 10000
temperature_night = 2100

[notification]
background_opacity = 0.4999999888241291

[osd]
background_opacity = 0.79999998211860657
hide_delay_ms = 1000

[plugins]
enabled = [ "autumn/network-toolkit", "noctalia/bitwarden", "liamwh/emoji-picker" ]

[shell]
font_family = "Hack Nerd Font"
niri_overview_type_to_launch_enabled = true
polkit_agent = true

    [shell.panel]
    control_center_position = "top_right"

    [shell.screenshot]
    confirm_region = true

[theme]
builtin = "Kanagawa"
community_palette = "Kanagawa Dragon"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk4", "niri" ]
    community_ids = []

[wallpaper]
directory = "/home/joao/Pictures/wallpapers"
fill_mode = "crop"

    [wallpaper.default]
    path = "/home/joao/Pictures/wallpapers/tree.jpg"

    [wallpaper.last]
    path = "/home/joao/Pictures/wallpapers/tree.jpg"

    [wallpaper.monitors.Virtual-1]
    path = "/home/joao/Pictures/wallpapers/tree.jpg"

    [wallpaper.monitors.winit]
    path = "/home/joao/Pictures/wallpapers/tree.jpg"

[weather]
enabled = false

[widget.battery]
enabled = false

[widget.clipboard]
enabled = false

[widget.clock]
format = "{:%H:%M, %a %d %b}"

[widget.control-center]
enabled = false

[widget.launcher]
enabled = false

[widget.media]
max_length = 300
rotate_album_art = true
show_progress = true
title_scroll = "always"

[widget.tray]
drawer = true
pinned = [ "zapzap" ]
scale = 1.4000000000000001
