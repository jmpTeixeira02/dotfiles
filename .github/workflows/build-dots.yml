name: Dots Build

on:
  pull_request:
    paths:
      - "tools/dots/**"
  push:
    branches: [main]
    paths:
      - "tools/dots/**"

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      tool: dots
      targets: |
        [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-musl"},
          {"os": "macos-latest",  "target": "aarch64-apple-darwin"}
        ]
