name: Release (reusable)

on:
  workflow_call:
    inputs:
      tool:
        required: true
        type: string
      version:
        required: true
        type: string
      targets:
        description: "JSON array of {os, target, asset} objects"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(inputs.targets) }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/${{ inputs.tool }} -> target"
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path tools/${{ inputs.tool }}/Cargo.toml

      - name: Prepare binary
        run: |
          cp tools/${{ inputs.tool }}/target/${{ matrix.target }}/release/${{ inputs.tool }} ${{ matrix.asset }}
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        env:
          VERSION: ${{ inputs.version }}
          TOOL: ${{ inputs.tool }}
        run: |
          PREFIX="${VERSION%%v*}v"
          PREV_TAG=$(git tag --list "${PREFIX}*" --sort=-v:refname | grep -vx "$VERSION" | head -n1 || true)

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_SHA}"
          else
            RANGE="${GITHUB_SHA}"
          fi

          {
            echo "## Changes"
            echo
            COMMITS=$(git log "$RANGE" --no-merges --pretty=format:"- %s (%h)" -- "tools/${TOOL}")
            if [ -n "$COMMITS" ]; then
              echo "$COMMITS"
            else
              echo "No changes to the CLI tool in this release."
            fi
            if [ -n "$PREV_TAG" ]; then
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${VERSION}"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: "${{ inputs.tool }} ${{ inputs.version }}"
          body_path: release-notes.md
          files: artifacts/*
