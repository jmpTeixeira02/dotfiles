name: Bunker Build

on:
  pull_request:
    paths:
      - "tools/bunker/**"
  push:
    branches: [main]
    paths:
      - "tools/bunker/**"

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      tool: bunker
      targets: |
        [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-musl"},
        ]
