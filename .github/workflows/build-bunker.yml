name: Bunker Build

on:
  pull_request:
    paths:
      - "tools/bunker/**"
  push:
    branches: [main]
    paths:
      - "tools/bunker/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/bunker -> target"
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path tools/bunker/Cargo.toml

      - name: Test
        run: cargo test --locked --manifest-path tools/bunker/Cargo.toml
