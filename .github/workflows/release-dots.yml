name: Release Dots

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      tool: dots
      version: ${{ inputs.version }}
      targets: |
        [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-musl", "asset": "dots-linux-x86_64"},
          {"os": "macos-latest",  "target": "aarch64-apple-darwin",       "asset": "dots-macos-aarch64"}
        ]
