version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/tools/dots"
    schedule:
      interval: "weekly"
    groups:
      rust:
        patterns:
          - "*"

  - package-ecosystem: "nix"
    directory: "/nix"
    schedule:
      interval: "weekly"
    groups:
      nix:
        patterns:
          - "*"
