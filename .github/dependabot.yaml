version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/tools/bunker"
      - "/tools/dots"
    schedule:
      interval: "weekly"
    groups:
      rust:
        patterns:
          - "*"

  - package-ecosystem: "nix"
    directory: "/nix"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 1
    groups:
      nix:
        patterns:
          - "*"
